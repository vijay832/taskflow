spring:
  application:
    name: taskflow

  # Default profile: H2 in-memory DB, no setup needed for a quick demo/video walkthrough
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: "replace-this-with-a-long-random-secret-key-for-production-use-only"
  expiration-ms: 86400000

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    driver-class-name: org.postgresql.Driver
    username: taskflow
    password: taskflow
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
